services:
  nginx:
    image: lg-nginx
    build:
      context: ..
      dockerfile: backend/docker/nginx/Dockerfile
    ports: !override
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes: !override
      - letsencrypt:/etc/letsencrypt
      - certbot_challenges:/var/www/certbot:ro

  backend:
    image: lg-backend
    build:
      args:
        INSTALL_DEV: "false"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      FRONTEND_URL: ${FRONTEND_URL:-${APP_URL}}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_ENCRYPTION: ${IMAP_ENCRYPTION:-ssl}
      IMAP_FOLDER: ${IMAP_FOLDER:-INBOX}
      IMAP_USERNAME: ${IMAP_USERNAME:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
    restart: unless-stopped
    volumes: !override
      - app_storage:/var/www/html/storage

  worker:
    image: lg-backend
    build: !reset null
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      FRONTEND_URL: ${FRONTEND_URL:-${APP_URL}}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_ENCRYPTION: ${IMAP_ENCRYPTION:-ssl}
      IMAP_FOLDER: ${IMAP_FOLDER:-INBOX}
      IMAP_USERNAME: ${IMAP_USERNAME:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
    restart: unless-stopped
    volumes: !override
      - app_storage:/var/www/html/storage

  mysql:
    restart: unless-stopped
    volumes:
      - mysql_data:/var/lib/mysql

  certbot:
    image: certbot/certbot:v2.11.0
    profiles:
      - certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_challenges:/var/www/certbot

volumes:
  app_storage:
  mysql_data:
  letsencrypt:
  certbot_challenges:
