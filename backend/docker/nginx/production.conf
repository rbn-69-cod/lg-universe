server {
    listen 80;
    server_name igruben.lat;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name igruben.lat;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 5s;

    client_max_body_size 25m;

    ssl_certificate /etc/letsencrypt/live/igruben.lat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/igruben.lat/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /robots.txt {
        alias /var/www/backend-public/robots.txt;
    }

    location ^~ /build/ {
        alias /var/www/backend-public/build/;
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    location ^~ /images/ {
        alias /var/www/backend-public/images/;
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    location ^~ /api/ {
        set $php_fpm_upstream backend:9000;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
        include fastcgi_params;
        fastcgi_pass $php_fpm_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires -1;
    }

    location ~ ^/(login|logout|register|forgot-password|reset-password|email|user|two-factor-challenge|confirmed-password-status|confirm-password|livewire|cron|legacy|tutorial-media|payment-media|ia-chat|up)(/.*)?$ {
        set $php_fpm_upstream backend:9000;
        include fastcgi_params;
        fastcgi_pass $php_fpm_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
