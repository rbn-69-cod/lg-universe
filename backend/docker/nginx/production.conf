server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    location = /robots.txt {
        alias /var/www/backend-public/robots.txt;
    }

    location ^~ /build/ {
        alias /var/www/backend-public/build/;
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    location ^~ /images/ {
        alias /var/www/backend-public/images/;
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120s;
    }

    location ~ ^/(login|logout|register|forgot-password|reset-password|email|user|two-factor-challenge|confirmed-password-status|confirm-password|livewire|cron|legacy|tutorial-media|payment-media|ia-chat|up)(/.*)?$ {
        include fastcgi_params;
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
