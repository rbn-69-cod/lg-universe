name: lg

services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        INSTALL_DEV: "true"
    env_file:
      - .env
    environment:
      APP_NAME: ${APP_NAME:-Laravel}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-laravel}
      DB_USERNAME: ${MYSQL_USER:-laravel}
      DB_PASSWORD: ${MYSQL_PASSWORD:-secret}
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Laravel}
      IMAP_SERVER: ${IMAP_SERVER:-}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-{mail.spacemail.com:993/imap/ssl}INBOX}
      IMAP_USERNAME: ${IMAP_USERNAME:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_SEARCH_CRITERIA: ${IMAP_SEARCH_CRITERIA:-UNSEEN}
      IMAP_MARK_SEEN: ${IMAP_MARK_SEEN:-true}
      EMAILS_PEDIDOS_TABLE: ${EMAILS_PEDIDOS_TABLE:-emails_pedidos}
      EMAILS_MAX_MINUTES: ${EMAILS_MAX_MINUTES:-7}
      IMAP_KEYWORDS_TEMPORAL: ${IMAP_KEYWORDS_TEMPORAL:-tu codigo de acceso temporal,codigo de acceso temporal,acceso temporal,codigo temporal,tu codigo de inicio de sesion,codigo de inicio de sesion,ingresa este codigo para iniciar sesion,iniciar sesion en netflix,login code,sign in code,code}
      IMAP_KEYWORDS_HOGAR: ${IMAP_KEYWORDS_HOGAR:-solicitaste actualizar tu hogar con netflix,actualizar tu hogar con netflix,hogar con netflix,update primary location,update-primary-location,household}
      CRON_TOKEN: ${CRON_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/auto}
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app

  worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        INSTALL_DEV: "true"
    env_file:
      - .env
    environment:
      APP_NAME: ${APP_NAME:-Laravel}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-laravel}
      DB_USERNAME: ${MYSQL_USER:-laravel}
      DB_PASSWORD: ${MYSQL_PASSWORD:-secret}
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Laravel}
      IMAP_SERVER: ${IMAP_SERVER:-}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-{mail.spacemail.com:993/imap/ssl}INBOX}
      IMAP_USERNAME: ${IMAP_USERNAME:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_SEARCH_CRITERIA: ${IMAP_SEARCH_CRITERIA:-UNSEEN}
      IMAP_MARK_SEEN: ${IMAP_MARK_SEEN:-true}
      EMAILS_PEDIDOS_TABLE: ${EMAILS_PEDIDOS_TABLE:-emails_pedidos}
      EMAILS_MAX_MINUTES: ${EMAILS_MAX_MINUTES:-7}
      IMAP_KEYWORDS_TEMPORAL: ${IMAP_KEYWORDS_TEMPORAL:-tu codigo de acceso temporal,codigo de acceso temporal,acceso temporal,codigo temporal,tu codigo de inicio de sesion,codigo de inicio de sesion,ingresa este codigo para iniciar sesion,iniciar sesion en netflix,login code,sign in code,code}
      IMAP_KEYWORDS_HOGAR: ${IMAP_KEYWORDS_HOGAR:-solicitaste actualizar tu hogar con netflix,actualizar tu hogar con netflix,hogar con netflix,update primary location,update-primary-location,household}
      CRON_TOKEN: ${CRON_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/auto}
    command: php artisan queue:work --sleep=3 --tries=${QUEUE_WORKER_TRIES:-3} --timeout=${QUEUE_WORKER_TIMEOUT:-90}
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-laravel}
      MYSQL_USER: ${MYSQL_USER:-laravel}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  mysql_data:
